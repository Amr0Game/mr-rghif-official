<style>
:root{--brand:#7A9E7D;--deep:#28622D;--deeper:#183F1B;--tint:#EDF4EE;--line:#D5E0D6;--tx:#12261B;--mu:#58695F;--red:#B3261E;--warn:#FEF3C7;--warn-tx:#92400E;--wa:#128C7E;box-sizing:border-box}*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;background:#fff;color:var(--tx);line-height:1.6;padding-bottom:40px}
header{background:var(--deeper);color:#fff;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}header img{height:36px}header .sp{margin-inline-end:auto}
button,a.b{font:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.b{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--deep);color:#fff;min-height:44px}.b.o{background:#fff;color:var(--deep);border:1.5px solid var(--deep)}.b.r{background:var(--red)}.b.wa{background:var(--wa)}.b.s{padding:6px 12px;min-height:36px;font-size:14px}.b:disabled{opacity:.5}
header .b{background:transparent;border:1px solid rgba(255,255,255,.5);min-height:38px;padding:5px 12px;font-size:14px}header .b.on{background:#fff;color:var(--deeper)}
.login{max-width:380px;margin:60px auto;padding:0 18px;text-align:center}.login img{width:200px;background:var(--brand);padding:18px;border-radius:20px}input,select{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;margin:6px 0 10px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;position:sticky;top:54px;background:#fff;z-index:4;border-bottom:1px solid var(--line)}.tab{flex:none;border:1.5px solid var(--deep);background:#fff;color:var(--deep);border-radius:999px;padding:8px 16px;font-weight:700}.tab[aria-pressed=true]{background:var(--deep);color:#fff}.tab i{font-style:normal;background:var(--red);color:#fff;border-radius:999px;padding:0 8px;margin-inline-start:6px;font-size:13px}
.wrap{padding:14px;max-width:1100px;margin:auto}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{border:1.5px solid var(--line);border-radius:16px;padding:14px;background:#fff;cursor:pointer}.card.new{border-color:var(--red);box-shadow:0 0 0 3px rgba(179,38,30,.15);animation:pl 1.6s infinite}@keyframes pl{50%{box-shadow:0 0 0 7px rgba(179,38,30,.05)}}
.card h3{margin:0;font-size:22px;color:var(--deep)}.m{color:var(--mu);font-size:14px}.tot{font-weight:700;font-size:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.alert{display:none;background:var(--red);color:#fff;text-align:center;padding:12px;font-weight:700;font-size:18px}.alert.on{display:flex;justify-content:center;align-items:center;gap:12px}.alert .b{background:#fff;color:var(--red);min-height:36px;padding:4px 14px}
.snd-warn{background:var(--warn);color:var(--warn-tx);padding:10px 14px;display:flex;justify-content:center;align-items:center;gap:10px;font-weight:700;font-size:14px;border-bottom:1px solid #FDE68A}.snd-warn.hide{display:none}.snd-warn .b{background:var(--warn-tx);color:#fff;min-height:32px;padding:4px 12px;font-size:13px}
dialog{border:0;border-radius:20px;padding:0;width:min(560px,94vw);max-height:92vh}dialog::backdrop{background:rgba(8,30,18,.6)}.in{padding:18px}.li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}

table{width:100%;border-collapse:collapse}td{padding:8px 4px;border-bottom:1px solid var(--line)}td input{margin:0;padding:8px}

 if(tab==="sum")return sum();if(tab==="menu")return menu();
 var def=TABS.filter(function(x){return x[0]===tab})[0],list=orders.filter(function(o){return def[2].indexOf(o.status)>-1});
 var s=tab==="hist"?'<input id="q" placeholder="ابحث برقم الطلب أو الاسم أو الجوال" value="'+esc(q)+'">':"";if(q&&tab==="hist")list=list.filter(function(o){return (o.ref+o.customer_name+o.customer_phone).toLowerCase().indexOf(q.toLowerCase())>-1});
 $("main").innerHTML=s+(list.length?'<div class="grid">'+list.map(card).join("")+'</div>':'<p class="m">لا توجد طلبات هنا.</p>');var qi=$("q");if(qi&&document.activeElement!==qi&&q){}}
function card(o){return '<div class="card '+(o.status==="new"&&!opened[o.id]?"new":"")+'" data-o="'+o.id+'"><div class="row"><h3>'+esc(o.ref)+'</h3><span class="pill">'+esc(ST[o.status]||o.status)+'</span></div><div>'+esc(o.customer_name)+' · <span dir="ltr">'+esc(o.customer_phone)+'</span></div><div class="m">'+esc(PK[o.pickup]||o.pickup)+' · '+ago(o.created_at)+' ('+tm(o.created_at)+')</div><div class="m">'+(o.order_items||[]).map(function(i){return esc(i.qty+"× "+i.item_name)}).join("، ")+'</div><div class="tot">'+esc(o.total)+' ر.س</div></div>'}
function detail(id){var o=orders.filter(function(x){return x.id===id})[0];if(!o)return;opened[id]=1;alarm(false);var n=NEXT[o.status];
 $("dg").innerHTML='<div class="in"><div class="print-hdr"><img src="'+LOGO+'" alt="مستر رغيف"><div><b>مستر رغيف — فاتورة طلب</b></div></div><div class="row"><h2 style="margin:0">'+esc(o.ref)+'</h2><span class="pill">'+esc(ST[o.status])+'</span></div><p class="m">'+esc(o.customer_name)+' · <a href="tel:'+esc(o.customer_phone)+'" dir="ltr">'+esc(o.customer_phone)+'</a><br>الاستلام: '+esc(PK[o.pickup]||o.pickup)+' · وصل '+tm(o.created_at)+' ('+ago(o.created_at)+')</p>'+(o.order_items||[]).map(function(i){var a=(i.addons||[]).map(function(x){return esc(x.name)}).join("، ");return '<div class="li"><span><b>'+esc(i.qty)+'× '+esc(i.item_name)+'</b>'+(a?'<br><small>+ '+a+'</small>':'')+(i.note?'<br><small>ملاحظة: '+esc(i.note)+'</small>':'')+'</span><span>'+esc(i.unit_price*i.qty)+'</span></div>'}).join("")+(o.note?'<p>ملاحظة الطلب: '+esc(o.note)+'</p>':'')+'<div class="row" style="margin-top:10px"><b>الإجمالي</b><span class="tot">'+esc(o.total)+' ر.س</span></div><div class="err" id="de"></div><div class="acts">'+(n?'<button class="b" data-s="'+n[0]+'" data-id="'+o.id+'">'+n[1]+'</button>':'')+'<a class="b wa" href="'+waCustomerUrl(o)+'" target="_blank" rel="noopener">تنبيه العميل واتساب</a><button class="b o" id="prn">طباعة الفاتورة</button>'+(o.status!=="completed"&&o.status!=="cancelled"?'<button class="b r" data-s="cancelled" data-id="'+o.id+'">إلغاء الطلب</button>':'')+'<button class="b o" data-x="1">إغلاق</button></div></div>';if(!$("dg").open)$("dg").showModal();draw()}
function setStatus(id,st){if(busy)return;if(st==="cancelled"&&!confirm("تأكيد إلغاء الطلب؟"))return;busy=true;api("orders?id=eq."+id,{method:"PATCH",body:{status:st},prefer:"return=representation"}).then(function(x){busy=false;if(x.ok&&x.j&&x.j.length&&x.j[0].status===st){orders.forEach(function(o){if(o.id===id)o.status=st});opened[id]=1;$("dg").close();alarm(false);draw()}else{$("de").textContent="تعذر تحديث الحالة (قد لا تملك الصلاحية). حاول مرة ثانية."}}).catch(function(){busy=false;$("de").textContent="تعذر الاتصال. حاول مرة ثانية."})}
function sum(){var d=new Date();d.setHours(0,0,0,0);var td=orders.filter(function(o){return new Date(o.created_at)>=d&&o.status!=="cancelled"}),tot=td.reduce(function(s,o){return s+Number(o.total)},0),by={};td.forEach(function(o){(o.order_items||[]).forEach(function(i){by[i.item_name]=(by[i.item_name]||0)+i.qty})});var top=Object.keys(by).sort(function(a,b){return by[b]-by[a]}).slice(0,5);
 $("main").innerHTML='<div class="stat"><div>عدد طلبات اليوم<b>'+td.length+'</b></div><div>مبيعات اليوم<b>'+tot.toFixed(2)+' ر.س</b></div><div>متوسط الطلب<b>'+(td.length?(tot/td.length).toFixed(2):"-")+'</b></div></div><h3>الأكثر طلباً اليوم</h3>'+(top.length?top.map(function(n){return '<div class="li"><span>'+esc(n)+'</span><b>'+by[n]+'</b></div>'}).join(""):'<p class="m">لا توجد بيانات بعد.</p>')+'<p class="m">الأرقام من الطلبات المسجلة فعلياً (آخر 300 طلب)، ولا تشمل الملغي.</p>'}
function menu(){$("main").innerHTML='<p class="m">جاري التحميل...</p>';api("menu_items?select=id,category,name_ar,price,is_visible&order=category.asc,id.asc").then(function(x){if(!x.ok||!Array.isArray(x.j)){$("main").innerHTML='<p class="err">تعذر تحميل المنيو</p>';return}
 $("main").innerHTML='<p class="m">تعديل السعر أو إخفاء الصنف عن العملاء. الصنف بدون سعر لا يمكن طلبه.</p><table>'+x.j.map(function(r){return '<tr data-m="'+r.id+'"><td>'+esc(r.name_ar)+'</td><td style="width:90px"><input type="number" step="0.5" min="0" value="'+esc(r.price==null?"":r.price)+'" class="pr"></td><td><label><input type="checkbox" class="vs" '+(r.is_visible?"checked":"")+' style="width:auto;margin:0"> ظاهر</label></td><td><button class="b s sv">حفظ</button></td></tr>'}).join("")+'</table><div class="err" id="me"></div>'})}
function saveMenu(tr){var id=tr.dataset.m,v=tr.querySelector(".pr").value.trim(),p=v===""?null:Number(v);if(p!==null&&(!isFinite(p)||p<0)){$("me").textContent="سعر غير صالح";return}api("menu_items?id=eq."+id,{method:"PATCH",body:{price:p,is_visible:tr.querySelector(".vs").checked},prefer:"return=representation"}).then(function(x){$("me").style.color=x.ok&&x.j&&x.j.length?"#28622D":"";$("me").textContent=x.ok&&x.j&&x.j.length?"تم الحفظ":"تعذر الحفظ (يحتاج صلاحية المالك)"})}
document.addEventListener("click",function(e){var t=e.target,b;
 if(t.id==="lg"){var em=$("em").value.trim(),pw=$("pw").value;if(!em||!pw){$("le").textContent="اكتب البريد وكلمة المرور";return}t.disabled=true;login(em,pw).then(enter).catch(function(){showLogin("بيانات الدخول غير صحيحة")});return}
 if(t.id==="out"){logout();return}
 if(t.id==="snd"||t.id==="snd2"){enableSound();return}
 if(t.id==="wk"){reqWake();return}
 if(t.id==="prn"){window.print();return}
 if(t.id==="mute"){muted=true;alarm(false);return}
 if(b=t.closest("[data-t]")){tab=b.dataset.t;draw();return}
 if(b=t.closest("[data-o]")){detail(b.dataset.o);return}
 if(b=t.closest("[data-s]")){setStatus(b.dataset.id,b.dataset.s);return}
 if(b=t.closest(".sv")){saveMenu(b.closest("tr"));return}
 if(t.dataset.x||t.id==="dg")$("dg").close()});
document.addEventListener("input",function(e){if(e.target.id==="q"){q=e.target.value;var pos=e.target.selectionStart;draw();var n=$("q");n.focus();n.setSelectionRange(pos,pos)}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&(e.target.id==="pw"||e.target.id==="em"))$("lg").click()});
document.addEventListener("visibilitychange",function(){if(!document.hidden&&sess&&wantWake&&!wake){reqWake()}});
(function(){try{var s=JSON.parse(sessionStorage.getItem("mr_sess")||"null");if(s&&s.rt){sess=s;sess.exp=sess.exp||0;enter().catch(function(){logout()});return}}catch(e){}showLogin()})();
</script></body></html>
